            card.innerHTML = `
                <h3>${done ? '🏆' : '🔒'} ${isAr ? a.nameAr : a.nameEn}</h3>
                <p>${isAr ? a.descAr : a.descEn}</p>
                <div class="price" style="color:${done ? '#0f6' : '#ff0'}">${done ? this.t('completed') : this.t('reward') + a.reward}</div>
            `;
            grid.appendChild(card);
        });
        this.screens.ach.classList.remove('hidden');
    }

    closeSubMenus() {
        this.hideAllScreens();
        this.refreshMenuStats();
        this.screens.start.classList.remove('hidden');
    }

    resetGameVars() {
        this.levelNum = 1;
        this.score = 0;
        this.lastDiamondMilestone = 0;
        this.maxEndlessX = 100;
        this.lives = 3;
        this.timeLeft = 65;
        this.combo = 0;
        this.checkpointX = 100;
        this.checkpointY = 200;
    }

    loadLevel(num) {
        this.levelNum = num;
        if (!this.isEndless && num >= 11) this.unlockAchievement('world_2');
        this.stageClearedLock = false;
        this.checkpointX = 100;
        this.checkpointY = 200;
        this.maxEndlessX = 100;
        this.platforms = this.gen.generate(num, this.isEndless);
        this.projectiles = [];
        this.particles = [];
        this.floatingTexts = [];
        this.player.reset();
        this.cameraX = 0;
        const worldIdx = Math.ceil(num / 10);
        this.maxStageTime = Math.max(48, 75 - worldIdx * 3);
        this.timeLeft = this.isEndless ? 999 : this.maxStageTime;

        if (!this.isEndless && num % 5 === 0) {
            this.boss = new BossCore(800, 180, num);
            document.getElementById('bossHud').classList.remove('hidden');
            document.getElementById('bossName').innerText = `${this.t('bossWarning')}${num / 5} ⚠️`;
            document.getElementById('bossBarInner').style.width = '100%';
            soundManager.startBGM(true);
        } else {
            this.boss = null;
            document.getElementById('bossHud').classList.add('hidden');
            soundManager.startBGM(false);
        }

        this.totalStageOrbs = 0;
        this.collectedStageOrbs = 0;
        this.totalStageEnemies = 0;
        this.killedStageEnemies = 0;
        this.stageDeaths = 0;

        this.platforms.forEach(p => {
            if (p.orb) this.totalStageOrbs++;
            if (p.drone) this.totalStageEnemies++;
        });
        if (this.boss) this.totalStageEnemies++;

        document.getElementById('missionHudBox').classList.toggle('hidden', this.isEndless);
        this.updateHUD();
    }

    addCombo() {
        this.combo++;
        this.comboTimer = 210;
        if (this.combo >= 10) this.unlockAchievement('combo_10');
        this.updateStyleHUD();
    }

    updateStyleHUD() {
        const box = document.getElementById('styleBox');
        if (this.combo <= 1) { box.classList.add('hidden'); return; }
        box.classList.remove('hidden');
        const ranks = ['D', 'C', 'B', 'A', 'S', 'SS', 'SSS'];
        const rIdx = Math.min(ranks.length - 1, Math.floor(this.combo / 2));
        document.getElementById('styleRank').innerText = ranks[rIdx];
        document.getElementById('comboText').innerText = `COMBO x${this.combo}`;
    }

    collectOrb(orb) {
        this.collectedStageOrbs++;
        this.addCombo();
        soundManager.playCollect();
        this.createParticles(orb.x + 8, orb.y + 8, '#ff0', 10);

        if (orb.kind === 'shield') {
            this.player.hasShield = true;
            this.floatingTexts.push(new FloatingText(orb.x, orb.y, this.t('shieldOn'), "#00ffff"));
        } else if (orb.kind === 'magnet') {
            this.player.magnetTimer = 450;
            this.floatingTexts.push(new FloatingText(orb.x, orb.y, this.t('magnetOn'), "#ff00ff"));
        } else {
            let pts = 50 * Math.max(1, Math.floor(this.combo / 2));
            this.addScore(pts);
            this.floatingTexts.push(new FloatingText(orb.x, orb.y, `+${pts}`));
        }
        this.updateHUD();
    }

    registerKill(x, y) {
        this.killedStageEnemies++;
        this.addCombo();
        soundManager.playKill();
        this.screenShake = 8;
        this.createParticles(x + 12, y + 12, '#ff0055', 18);
        let pts = 100 * Math.max(1, Math.floor(this.combo / 2));
        this.addScore(pts);
        this.unlockAchievement('first_kill');
        this.floatingTexts.push(new FloatingText(x, y, `+${pts}`, "#ff0055"));
        this.updateHUD();
    }

    hitPlayer() {
        if (this.player.invulnTimer > 0 || this.player.dead) return;
        if (this.player.hasShield) {
            this.player.hasShield = false;
            this.player.invulnTimer = 50;
            this.screenShake = 12;
            soundManager.playShieldHit();
            this.createParticles(this.player.x + 15, this.player.y + 15, '#00ffff', 25);
            this.floatingTexts.push(new FloatingText(this.player.x, this.player.y - 10, this.t('shieldBroken'), "#00ffff"));
            return;
        }
        this.loseLife(false);
    }

    loseLife(fellInPit = false) {
        if (this.player.dead || this.stageClearedLock) return;
        this.player.dead = true;
        this.stageDeaths++;
        this.combo = 0;
        this.updateStyleHUD();
        soundManager.playDeath();
        this.screenShake = 22;
        this.createParticles(this.player.x + 15, this.player.y + 15, '#ff0055', 40);
        this.lives--;

        if (this.isEndless) {
            const finalRunScore = this.score;
            if (finalRunScore > saveSys.data.endlessHighScore) {
                saveSys.data.endlessHighScore = finalRunScore;
                saveSys.save();
            }
            this.score = 0;
            this.lastDiamondMilestone = 0;
            this.maxEndlessX = 100;
            this.checkpointX = 100;
            this.checkpointY = 200;

            if (this.lives <= 0) {
                this.updateHUD();
                setTimeout(() => {
                    this.isPaused = true;
                    soundManager.stopBGM();
                    const isAr = saveSys.data.lang === 'ar';
                    document.getElementById('gameOverStats').innerText = isAr
                        ? `سكور المحاولة: ${finalRunScore} (تمت إعادة السكور إلى 0) | أعلى سكور لانهائي: ${saveSys.data.endlessHighScore} | 💎 ${saveSys.data.credits}`
                        : `RUN SCORE: ${finalRunScore} (SCORE RESET TO 0) | ENDLESS BEST: ${saveSys.data.endlessHighScore} | 💎 ${saveSys.data.credits}`;
                    this.screens.over.classList.remove('hidden');
                }, 900);
                return;
            } else {
                this.updateHUD();
                setTimeout(() => {
                    this.platforms = this.gen.generate(1, true);
                    this.player.reset();
                    this.cameraX = 0;
                    this.updateHUD();
                }, 900);
                return;
            }
        }

        this.updateHUD();

        if (this.lives <= 0) {
            if (this.score > saveSys.data.highScore) saveSys.data.highScore = this.score;
            saveSys.save();
            setTimeout(() => {
                this.isPaused = true;
                soundManager.stopBGM();
                const isAr = saveSys.data.lang === 'ar';
                document.getElementById('gameOverStats').innerText = isAr
                    ? `مجموع النقاط: ${this.score} | أعلى سكور: ${saveSys.data.highScore} | الألماس: 💎 ${saveSys.data.credits}`
                    : `FINAL SCORE: ${this.score} | HIGH SCORE: ${saveSys.data.highScore} | DIAMONDS: 💎 ${saveSys.data.credits}`;
                this.screens.over.classList.remove('hidden');
            }, 950);
        } else {
            setTimeout(() => {
                this.timeLeft = this.maxStageTime;
                this.player.reset();
                this.cameraX = Math.max(0, this.player.x - 200);
                this.updateHUD();
            }, 900);
        }
    }

    levelComplete() {
        if (this.stageClearedLock || this.player.dead) return;
        this.stageClearedLock = true;
        this.isPaused = true;

        soundManager.playWin();
        const timeBonus = Math.ceil(this.timeLeft) * 5;
        this.addScore(timeBonus);
        if (this.score > saveSys.data.highScore) saveSys.data.highScore = this.score;

        const gotOrbsStar = (this.collectedStageOrbs >= this.totalStageOrbs);
        const gotLivesStar = (this.stageDeaths === 0);
        const gotEnemiesStar = (this.killedStageEnemies >= this.totalStageEnemies);

        const prevStars = saveSys.data.stageStars[this.levelNum] || [false, false, false];
        const updatedStars = [
            prevStars[0] || gotOrbsStar,
            prevStars[1] || gotLivesStar,
            prevStars[2] || gotEnemiesStar
        ];
        saveSys.data.stageStars[this.levelNum] = updatedStars;

        if (updatedStars[0] && updatedStars[1] && updatedStars[2]) {
            this.unlockAchievement('perfect_3star');
        }

        if (this.levelNum < this.totalLevels && this.levelNum + 1 > saveSys.data.maxStageUnlocked) {
            saveSys.data.maxStageUnlocked = this.levelNum + 1;
        }
        saveSys.save();

        const starDiamondsEarned = this.checkStarDiamonds();
        this.updateHUD();

        if (this.levelNum < this.totalLevels && !this.isEndless) {
            const isAr = saveSys.data.lang === 'ar';

            let bigStarsHtml = '';
            for (let i = 0; i < 3; i++) {
                bigStarsHtml += `<span class="${updatedStars[i] ? 'star-on' : 'star-off'}">★</span>`;
            }
            document.getElementById('stageStarsBig').innerHTML = bigStarsHtml;

            document.getElementById('starRow1').innerHTML = `
                <span>${this.t('condOrbs')} (${this.collectedStageOrbs}/${this.totalStageOrbs})</span>
                <span class="${gotOrbsStar ? 'star-on' : 'star-off'}">${gotOrbsStar ? this.t('starDone') : this.t('starMiss')}</span>
            `;
            document.getElementById('starRow2').innerHTML = `
                <span>${this.t('condLives')}</span>
                <span class="${gotLivesStar ? 'star-on' : 'star-off'}">${gotLivesStar ? this.t('starDone') : this.t('starMiss')}</span>
            `;
            document.getElementById('starRow3').innerHTML = `
                <span>${this.t('condEnemies')} (${this.killedStageEnemies}/${this.totalStageEnemies})</span>
                <span class="${gotEnemiesStar ? 'star-on' : 'star-off'}">${gotEnemiesStar ? this.t('starDone') : this.t('starMiss')}</span>
            `;

            let bonusMsg = isAr
                ? `مكافأة الوقت: +${timeBonus} نقطة | مجموع نجومك: ★ ${saveSys.getTotalStars()} / 210`
                : `TIME BONUS: +${timeBonus} PTS | TOTAL STARS: ★ ${saveSys.getTotalStars()} / 210`;
            if (starDiamondsEarned > 0) {
                bonusMsg += isAr ? ` | 🎉 +${starDiamondsEarned} 💎 مكافأة 3 نجوم!` : ` | 🎉 +${starDiamondsEarned} 💎 3-STAR BONUS!`;
            }
            document.getElementById('stageBonusText').innerText = bonusMsg;
            document.getElementById('choosePerkText').innerText = `${this.t('choosePerk')}${saveSys.data.credits}`;
            this.screens.stage.classList.remove('hidden');
        } else {
            soundManager.stopBGM();
            document.getElementById('victoryDesc').innerText = `${this.t('victoryDesc')}${this.score}`;
            this.screens.victory.classList.remove('hidden');
        }
    }

    updateHUD() {
        const endlessSpd = (1 + Math.min(0.8, this.score / 15000)).toFixed(1);
        const worldIdx = Math.ceil(this.levelNum / 10);
        const stgInWorld = ((this.levelNum - 1) % 10) + 1;
        const isAr = saveSys.data.lang === 'ar';

        document.getElementById('levelDisplay').innerText = this.isEndless
            ? `${this.t('endlessSector')}${endlessSpd})`
            : (isAr ? `المنصة ${worldIdx} (${stgInWorld}/10) [#${this.levelNum}/70]` : `PLAT ${worldIdx}-${stgInWorld} [${this.levelNum}/70]`);
        document.getElementById('scoreDisplay').innerText = `${this.t('score')}: ${this.score.toString().padStart(5, '0')}`;
        document.getElementById('creditDisplay').innerText = `💎 ${saveSys.data.credits}`;
        document.getElementById('starHudDisplay').innerText = `★ ${saveSys.getTotalStars()} (3★=1💎)`;

        const progPercent = ((this.score % 1000) / 1000) * 100;
        document.getElementById('diamondBar').style.width = `${progPercent}%`;

        const hudTime = document.getElementById('time-display');
        hudTime.innerText = this.isEndless
            ? `${this.t('time')}: ∞`
            : `${this.t('time')}: ${Math.max(0, Math.ceil(this.timeLeft))}`;

        if (!this.isEndless && this.timeLeft <= 10) hudTime.classList.add('low');
        else hudTime.classList.remove('low');

        document.getElementById('energyBar').style.width = `${this.player.energy}%`;

        if (!this.isEndless) {
            const orbsDone = this.collectedStageOrbs >= this.totalStageOrbs;
            const enemiesDone = this.killedStageEnemies >= this.totalStageEnemies;
            const noDeathDone = this.stageDeaths === 0;
            document.getElementById('orbsHud').innerHTML = `<span style="color:${orbsDone ? '#0f6' : '#ffcc00'}">🟡 ${this.collectedStageOrbs}/${this.totalStageOrbs}</span>`;
            document.getElementById('enemiesHud').innerHTML = `<span style="color:${enemiesDone ? '#0f6' : '#ff6699'}">👾 ${this.killedStageEnemies}/${this.totalStageEnemies}</span>`;
            document.getElementById('noDeathHud').innerHTML = `<span style="color:${noDeathDone ? '#0f6' : '#777'}">❤️ ${noDeathDone ? '★' : '✗'}</span>`;
        }

        const lc = document.getElementById('lifeContainer');
        lc.innerHTML = '';
        for (let i = 0; i < Math.min(9, this.lives); i++) {
            let icon = document.createElement('span');
            icon.className = 'life-icon';
            lc.appendChild(icon);
        }
    }

    createParticles(x, y, color, count, type = 'spark') {
        for (let i = 0; i < count; i++) this.particles.push(new Particle(x, y, color, type));
    }

    animate(time) {
        if (this.isPaused) return;
        this.rafId = requestAnimationFrame(t => this.animate(t));
        const dt = Math.min(0.1, (time - this.lastTime) / 1000);
        this.lastTime = time;
        this.timeAccumulator += dt;

        while (this.timeAccumulator >= this.step) {
            this.update(this.step);
            this.timeAccumulator -= this.step;
        }
        this.draw();
    }

    update(dt) {
        let dtScale = 1.0;
        if (this.isEndless) {
            dtScale = 1.0 + Math.min(0.65, this.score / 18000);
            const lastPlat = this.platforms[this.platforms.length - 1];
            if (lastPlat && this.player.x + 1500 > lastPlat.x) {
                this.gen.generateChunk(this.platforms, lastPlat.x + lastPlat.w, lastPlat.y, 4000, 25, true);
            }
        }
        if ((this.input.keys['KeyQ'] || this.input.keys['KeyE']) && this.player.energy > 2) {
            dtScale = 0.42;
            this.player.energy = Math.max(0, this.player.energy - 0.55);
        }

        this.player.update(this.input, this.platforms, dtScale);
        this.bg.update(this.player.vx, dtScale);

        if (this.combo > 0) {
            this.comboTimer -= dtScale;
            if (this.comboTimer <= 0) { this.combo = 0; this.updateStyleHUD(); }
        }

        if (this.boss && !this.boss.dead) {
            this.boss.update(this.player, this, dtScale);
        }

        this.projectiles.forEach(proj => {
            proj.update(dtScale);
            if (Math.abs(proj.x - this.player.x) > 850) proj.dead = true;

            if (proj.isEnemy) {
                if (proj.x > this.player.x && proj.x < this.player.x + 30 && proj.y > this.player.y && proj.y < this.player.y + 30) {
                    proj.dead = true;
                    this.hitPlayer();
                }
            } else {
                this.platforms.forEach(p => {
                    if (p.drone && !p.drone.dead) {
                        if (proj.x > p.drone.x && proj.x < p.drone.x + 28 && proj.y > p.drone.y && proj.y < p.drone.y + 28) {
                            proj.dead = true;
                            p.drone.dead = true;
                            this.registerKill(p.drone.x, p.drone.y);
                        }
                    }
                });
                if (this.boss && !this.boss.dead) {
                    if (proj.x > this.boss.x && proj.x < this.boss.x + this.boss.w && proj.y > this.boss.y && proj.y < this.boss.y + this.boss.h) {
                        proj.dead = true;
                        this.boss.hp--;
                        this.createParticles(proj.x, proj.y, '#ffff00', 6);
                        document.getElementById('bossBarInner').style.width = `${Math.max(0, (this.boss.hp / this.boss.maxHp) * 100)}%`;
                        if (this.boss.hp <= 0) {
                            this.boss.dead = true;
                            this.killedStageEnemies++;
                            document.getElementById('bossHud').classList.add('hidden');
                            this.screenShake = 28;
                            soundManager.playWin();
                            this.createParticles(this.boss.x + 34, this.boss.y + 34, '#ff0055', 55);
                            this.addScore(1000);
                            this.unlockAchievement('boss_slayer');
                            this.floatingTexts.push(new FloatingText(this.boss.x, this.boss.y, this.t('bossDefeated'), "#ffff00"));
                        }
                    }
                }
            }
        });
        this.projectiles = this.projectiles.filter(proj => !proj.dead);

        this.particles.forEach(p => p.update(dtScale));
        this.particles = this.particles.filter(p => p.life > 0);

        this.floatingTexts.forEach(t => t.update(dtScale));
        this.floatingTexts = this.floatingTexts.filter(t => t.life > 0);

        this.screenShake = Math.max(0, this.screenShake * 0.88);
        let target = this.player.x - 220;
        if (target < 0) target = 0;
        this.cameraX += (target - this.cameraX) * 0.12;

        if (!this.isEndless && !this.player.dead) {
            this.timeLeft -= dt * dtScale;
            if (this.timeLeft <= 0) {
                this.timeLeft = 0;
                this.loseLife(true);
            }
        } else if (this.isEndless && !this.player.dead) {
            if (this.player.x > this.maxEndlessX) {
                const distGained = this.player.x - this.maxEndlessX;
                this.maxEndlessX = this.player.x;
                this.addScore(Math.floor(distGained * 0.15));
            }
        }
        this.updateHUD();
    }

    drawPlatformShape(p, edgeColor, shakeX) {
        const px = p.x + shakeX;
        const py = p.y;
        const pw = p.w;
        const wIdx = p.worldIdx || 1;

        ctx.save();
        ctx.shadowBlur = 10;
        ctx.shadowColor = edgeColor;

        if (wIdx === 1) {
            ctx.fillStyle = '#070510';
            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(px + pw, py);
            ctx.lineTo(px + pw - 10, py + 38);
            ctx.lineTo(px + 10, py + 38);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = edgeColor;
            ctx.fillRect(px, py, pw, 5);
        } else if (wIdx === 2) {
            ctx.fillStyle = '#051218';
            ctx.fillRect(px, py, pw, 36);
            ctx.strokeStyle = edgeColor;
            ctx.lineWidth = 1.5;
            for (let gx = px + 16; gx < px + pw - 8; gx += 20) {
                ctx.beginPath();
                ctx.moveTo(gx, py + 5);
                ctx.lineTo(gx - 10, py + 36);
                ctx.stroke();
            }
            ctx.fillStyle = edgeColor;
            ctx.fillRect(px, py, pw, 5);
        } else if (wIdx === 3) {
            ctx.fillStyle = '#180d04';
            ctx.fillRect(px, py, pw, 24);
            ctx.fillStyle = edgeColor;
            ctx.fillRect(px, py, pw, 5);
            ctx.fillRect(px + 12, py + 24, 16, 12);
            ctx.fillRect(px + pw - 28, py + 24, 16, 12);
        } else if (wIdx === 4) {
            ctx.fillStyle = '#160824';
            ctx.fillRect(px, py, pw, 38);
            ctx.strokeStyle = edgeColor;
            ctx.lineWidth = 2;
            ctx.strokeRect(px + 4, py + 8, pw - 8, 24);
            ctx.fillStyle = edgeColor;
            ctx.fillRect(px, py, pw, 6);
        } else if (wIdx === 5) {
            ctx.fillStyle = '#041226';
            ctx.fillRect(px, py, pw, 14);
            ctx.fillRect(px + 6, py + 24, pw - 12, 12);
            ctx.fillStyle = edgeColor;
            ctx.fillRect(px, py, pw, 5);
            for (let rx = px + 20; rx < px + pw - 15; rx += 35) {
                ctx.fillRect(rx, py + 14, 4, 10);
            }
        } else if (wIdx === 6) {
            ctx.fillStyle = '#220410';
            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(px + pw, py);
            for (let sx = px + pw; sx >= px; sx -= 25) {
                ctx.lineTo(sx - 12, py + 42);
                ctx.lineTo(Math.max(px, sx - 25), py + 24);
            }
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = edgeColor;
            ctx.fillRect(px, py, pw, 6);
        } else {
            ctx.fillStyle = '#1f1a00';
            ctx.fillRect(px, py, pw, 34);
            ctx.fillStyle = edgeColor;
            ctx.fillRect(px, py, pw, 6);
            ctx.fillRect(px, py + 30, pw, 4);
            ctx.fillStyle = '#ff0055';
            for (let ox = px + 14; ox < px + pw - 14; ox += 28) {
                ctx.fillRect(ox, py + 13, 12, 10);
            }
        }
        ctx.restore();
    }

    draw() {
        const biome = BIOMES[Math.floor((this.levelNum - 1) / 2) % BIOMES.length];
        let sx = (Math.random() - 0.5) * this.screenShake;
        let sy = (Math.random() - 0.5) * this.screenShake;

        ctx.save();
        ctx.translate(sx, sy);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        this.bg.draw(biome);
        ctx.save();
        ctx.translate(-this.cameraX, 0);

        this.platforms.forEach(p => {
            if (p.x - this.cameraX > canvas.width + 80 || p.x + p.w - this.cameraX < -80) return;
            if (p.type === 'crumble' && p.crumbleState === 2) return;

            const worldObj = PLATFORMS_WORLDS[(p.worldIdx || 1) - 1] || PLATFORMS_WORLDS[0];
            let edgeColor = worldObj.accent;
            if (p.isMoving) edgeColor = '#ff00ff';
            if (p.type === 'bounce') edgeColor = '#00ff66';
            if (p.type === 'crumble') edgeColor = '#ff8800';

            let shakeX = (p.type === 'crumble' && p.crumbleState === 1) ? (Math.random() - 0.5) * 6 : 0;

            this.drawPlatformShape(p, edgeColor, shakeX);

            if (p.checkpoint) {
                let cpColor = p.checkpointClaimed ? '#00ff66' : '#ffff00';
                ctx.fillStyle = cpColor;
                ctx.fillRect(p.x + p.w / 2 - 2, p.y - 45, 4, 45);
                ctx.beginPath();
                ctx.moveTo(p.x + p.w / 2 + 2, p.y - 45);
                ctx.lineTo(p.x + p.w / 2 + 28, p.y - 34);
                ctx.lineTo(p.x + p.w / 2 + 2, p.y - 23);
                ctx.fill();
            }

            if (p.type === 'goal') {
                ctx.shadowBlur = 22; ctx.shadowColor = '#ff0'; ctx.strokeStyle = '#ff0'; ctx.lineWidth = 4;
                ctx.strokeRect(p.x + p.w / 2 - 32, p.y - 68, 64, 68);
                let t = Date.now() / 140;
                ctx.save(); ctx.translate(p.x + p.w / 2, p.y - 34); ctx.rotate(t);
                ctx.fillStyle = '#ff0'; ctx.fillRect(-16, -16, 32, 32);
                ctx.restore();
            } else if (p.type === 'spike') {
                const sx = p.x + p.w / 2, sy = p.y;
                ctx.shadowBlur = 10; ctx.shadowColor = '#ff0055';
                ctx.fillStyle = '#ff0055';
                ctx.beginPath();
                ctx.moveTo(sx - 15, sy); ctx.lineTo(sx + 15, sy); ctx.lineTo(sx, sy - 30);
                ctx.fill();
                ctx.shadowBlur = 0;
            } else if (p.type === 'laser') {
                const lx = p.x + p.w / 2;
                ctx.fillStyle = '#555';
                ctx.fillRect(lx - 10, p.y - 95, 20, 8);
                if (p.laserActive) {
                    ctx.shadowBlur = 15; ctx.shadowColor = '#ff0055';
                    ctx.fillStyle = '#ff0055';
                    ctx.fillRect(lx - 4, p.y - 87, 8, 87);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(lx - 1, p.y - 87, 2, 87);
                    ctx.shadowBlur = 0;
                }
            }

            if (p.drone && !p.drone.dead) {
                let d = p.drone;
                ctx.save();
                ctx.shadowBlur = 12; ctx.shadowColor = '#ff0055';
                ctx.fillStyle = '#220011';
                ctx.fillRect(d.x, d.y, 26, 22);
                ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 2;
                ctx.strokeRect(d.x, d.y, 26, 22);
                ctx.fillStyle = '#ff0055';
                ctx.fillRect(d.x + 8, d.y + 7, 10, 6);
                ctx.restore();
            }

            if (p.orb && !p.orb.collected) {
                let c = '#ffff00';
                if (p.orb.kind === 'shield') c = '#00ffff';
                if (p.orb.kind === 'magnet') c = '#ff00ff';
                ctx.save();
                ctx.shadowBlur = 12; ctx.shadowColor = c;
                ctx.fillStyle = c;
                ctx.beginPath(); ctx.arc(p.orb.x + 8, p.orb.y + 8, 10, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.fillRect(p.orb.x + 5, p.orb.y + 5, 6, 6);
                ctx.restore();
            }
        });

        if (this.boss) this.boss.draw();
        this.projectiles.forEach(pr => pr.draw());
        this.particles.forEach(pt => pt.draw());
        this.floatingTexts.forEach(ft => ft.draw());
        this.player.draw();

        ctx.restore();

        if ((this.input.keys['KeyQ'] || this.input.keys['KeyE']) && this.player.energy > 2) {
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.45)';
            ctx.lineWidth = 10;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);
        }
        ctx.restore();
    }
}

window.game = new Game();
</script>

<!DOCTYPE html>
<html lang="ar">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NEON NEXUS: ULTIMATE EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #050011;
            --bg-bot: #1a0033;
            --ui-text: #fff;
            --accent: #00ffff;
            --danger: #ff0055;
            --goal: #ffff00;
            --purple: #b829ff;
            --green: #00ff66;
            --font-main: 'Press Start 2P', 'Cairo', sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            background-color: #020008;
            color: var(--ui-text);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body.lang-ar {
            font-family: 'Cairo', 'Press Start 2P', sans-serif;
        }

        /* Responsive Multi-Device Container (Phone, iPad, PC) */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 960px;
            max-height: 540px;
            aspect-ratio: 16 / 9;
            background: linear-gradient(to bottom, var(--bg-top), var(--bg-bot));
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.25), inset 0 0 30px rgba(255, 0, 85, 0.15);
            border: 3px solid #2a2a4a;
            overflow: hidden;
        }

        @media (max-width: 960px), (max-height: 540px) {
            #game-container {
                max-width: 100vw;
                max-height: 100dvh;
                border-width: 2px;
            }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .scanline {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.22) 50%, rgba(0,0,0,0.22));
            background-size: 100% 4px; pointer-events: none; z-index: 25; opacity: 0.35;
        }

        /* --- HUD --- */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; padding: 8px 14px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 12; text-shadow: 2px 2px #000;
            font-size: clamp(9px, 1.3vw, 11px);
        }

        .hud-panel {
            background: rgba(5, 0, 20, 0.78);
            border: 1px solid rgba(0, 255, 255, 0.35);
            padding: 6px 10px;
            border-radius: 4px;
            backdrop-filter: blur(2px);
        }

        .stat-box { margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
        .stat-box:last-child { margin-bottom: 0; }

        .life-icon {
            display: inline-block; width: 10px; height: 10px;
            background: var(--danger); margin-right: 3px;
            transform: rotate(45deg); box-shadow: 0 0 6px var(--danger), 1px 1px #fff;
        }

        .bar-wrap {
            width: 80px; height: 8px; background: #111; border: 1px solid #555;
            position: relative; overflow: hidden;
        }
        .bar-fill { height: 100%; transition: width 0.1s; }

        .diamond-prog-wrap {
            width: 90px; height: 6px; background: #112; border: 1px solid #0f6;
            overflow: hidden; display: inline-block; vertical-align: middle;
        }
        #diamondBar { height: 100%; width: 0%; background: linear-gradient(90deg, #00ffff, #00ff66); transition: width 0.15s; }

        /* Boss Health Bar */
        #bossHud {
            position: absolute; top: 82px; left: 50%; transform: translateX(-50%);
            width: 50%; background: rgba(20, 0, 10, 0.88); border: 2px solid var(--danger);
            padding: 4px 10px; z-index: 12; text-align: center; pointer-events: none;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
        }
        #bossName { font-size: 10px; color: var(--danger); margin-bottom: 3px; font-weight: bold; }
        #bossBarOuter { width: 100%; height: 8px; background: #200; border: 1px solid #f05; }
        #bossBarInner { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0055, #ff9900); transition: width 0.15s; }

        /* Style Rank Badge */
        #styleBox {
            position: absolute; top: 98px; right: 16px; text-align: right;
            pointer-events: none; z-index: 12;
        }
        #styleRank {
            font-size: 22px; color: var(--goal); font-family: 'Press Start 2P', cursive;
            text-shadow: 0 0 12px var(--goal), 3px 3px #000;
        }
        #comboText { font-size: 10px; color: #0ff; margin-top: 2px; font-weight: bold; }

        /* Top Quick Controls */
        #quickControls {
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 5px; z-index: 20;
        }
        .mini-btn {
            background: rgba(0, 0, 0, 0.85); color: var(--accent);
            border: 1px solid var(--accent); padding: 4px 8px;
            font-family: inherit; font-size: clamp(8px, 1.1vw, 10px); font-weight: bold;
            cursor: pointer; pointer-events: auto; border-radius: 3px;
        }
        .mini-btn:hover { background: var(--accent); color: #000; }
        .mini-btn.lang { border-color: var(--goal); color: var(--goal); }
        .mini-btn.lang:hover { background: var(--goal); color: #000; }

        /* --- OVERLAYS & MENUS --- */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(15, 0, 40, 0.94), rgba(0, 0, 5, 0.98));
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            z-index: 18; transition: opacity 0.25s; padding: 10px;
            overflow-y: auto;
        }
        .hidden { opacity: 0; pointer-events: none !important; display: none !important; }

        .terminal-text {
            color: var(--accent); font-family: 'Cairo', 'Courier New', monospace; font-size: clamp(10px, 1.3vw, 12px);
            margin-bottom: 5px; text-align: left; width: 86%; max-width: 660px;
            border-left: 3px solid var(--accent); padding-left: 10px;
            text-shadow: 0 0 6px var(--accent); line-height: 1.4;
        }
        body.lang-ar .terminal-text {
            text-align: right; border-left: none; border-right: 3px solid var(--accent);
            padding-left: 0; padding-right: 10px; direction: rtl;
        }

        h1 {
            color: #fff; text-shadow: 4px 4px #ff0055, -2px -2px #00ffff;
            font-size: clamp(18px, 3vw, 28px); margin: 3px 0; letter-spacing: 2px;
            font-family: 'Press Start 2P', 'Cairo', sans-serif;
            animation: pulse 3s infinite;
        }
        .subtitle {
            font-size: clamp(9px, 1.3vw, 12px); color: var(--goal); letter-spacing: 1px;
            margin-bottom: 6px; text-shadow: 0 0 8px var(--goal); font-weight: bold;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

        p { font-size: clamp(9px, 1.2vw, 11px); color: #ccc; margin-bottom: 8px; line-height: 1.5; max-width: 92%; }

        .menu-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }

        .btn {
            background: var(--accent); color: #000; border: none; padding: 8px 14px;
            font-family: inherit; font-size: clamp(9px, 1.2vw, 11px); font-weight: 900; cursor: pointer;
            box-shadow: 0 4px 0 #007777, 0 0 15px rgba(0,255,255,0.4);
            transition: transform 0.1s, box-shadow 0.1s, background 0.15s; border-radius: 4px;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #007777; }
        .btn:hover { background: #fff; }
        .btn.alt { background: var(--purple); color: #fff; box-shadow: 0 4px 0 #590088, 0 0 15px rgba(184,41,255,0.4); }
        .btn.alt:hover { background: #d580ff; color: #000; }
        .btn.gold { background: var(--goal); color: #000; box-shadow: 0 4px 0 #998800, 0 0 15px rgba(255,255,0,0.4); }
        .btn.danger { background: var(--danger); color: #fff; box-shadow: 0 4px 0 #880022; }
        .btn.green { background: var(--green); color: #000; box-shadow: 0 4px 0 #007733; }

        /* Shop & Skins Grid */
        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px;
            width: 95%; max-width: 820px; max-height: 55vh; overflow-y: auto;
            padding: 8px; margin-bottom: 8px;
            background: rgba(5, 0, 18, 0.55); border: 1px solid #335; border-radius: 6px;
        }
        .card {
            background: rgba(15, 10, 35, 0.94); border: 2px solid #334;
            padding: 8px; display: flex; flex-direction: column; align-items: center;
            justify-content: space-between; border-radius: 4px;
        }
        .card.active { border-color: var(--green); box-shadow: 0 0 12px rgba(0,255,102,0.35); }
        .card h3 { font-size: 11px; color: var(--accent); margin: 3px 0; }
        .card p { font-size: 9px; color: #bbb; margin: 3px 0 6px 0; line-height: 1.35; }
        .card .price { font-size: 10px; color: var(--goal); margin-bottom: 5px; font-weight: bold; }
        .card button { font-size: 10px; padding: 5px 8px; width: 100%; }

        /* 7 Platforms (Worlds) Selector Tabs */
        #worldTabs {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
            width: 95%;
            max-width: 820px;
            margin-bottom: 6px;
        }
        .world-tab {
            background: rgba(15, 10, 35, 0.9);
            border: 2px solid #446;
            color: #ccc;
            padding: 5px 9px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: clamp(8px, 1.1vw, 10px);
            font-weight: bold;
            transition: all 0.15s;
        }
        .world-tab.active {
            border-color: var(--accent);
            background: rgba(0, 255, 255, 0.2);
            color: #fff;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
        }

        #worldInfoBanner {
            width: 95%;
            max-width: 820px;
            padding: 5px 12px;
            margin-bottom: 6px;
            border-radius: 4px;
            background: rgba(20, 5, 40, 0.85);
            border: 1px solid var(--purple);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: clamp(9px, 1.2vw, 11px);
        }

        /* 10 Stages per Platform Grid */
        #levelGrid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 95%;
            max-width: 820px;
            max-height: 36vh;
            overflow-y: auto;
            padding: 8px;
            margin-bottom: 8px;
            background: rgba(5, 0, 18, 0.65);
            border: 1px solid #335;
            border-radius: 6px;
        }
        .lvl-card {
            background: rgba(20, 12, 45, 0.95);
            border: 2px solid #00aaaa;
            border-radius: 5px;
            padding: 8px 4px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.12s, border-color 0.15s, box-shadow 0.15s;
        }
        .lvl-card:hover:not(.locked) {
            transform: translateY(-2px);
            border-color: var(--goal);
            box-shadow: 0 0 12px rgba(255, 255, 0, 0.45);
        }
        .lvl-card.cleared {
            border-color: var(--green);
            background: rgba(5, 35, 25, 0.9);
        }
        .lvl-card.boss-stage:not(.locked) {
            border-color: var(--danger);
        }
        .lvl-card.locked {
            border-color: #333;
            background: rgba(15, 15, 20, 0.75);
            opacity: 0.55;
            cursor: not-allowed;
        }
        .lvl-num {
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 3px;
        }
        .lvl-stars {
            font-size: 13px;
            letter-spacing: 2px;
        }
        .star-on { color: #ffcc00; text-shadow: 0 0 6px #ffcc00; }
        .star-off { color: #444; }

        /* Stage Clear Star Breakdown Box */
        .star-summary-box {
            background: rgba(10, 5, 30, 0.9);
            border: 2px solid var(--goal);
            border-radius: 6px;
            padding: 6px 14px;
            margin-bottom: 6px;
            width: 88%;
            max-width: 540px;
        }
        .star-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            margin: 3px 0;
            padding-bottom: 3px;
            border-bottom: 1px dashed rgba(255,255,255,0.15);
        }
        .star-row:last-child { border-bottom: none; }

        .credit-container {
            position: absolute; bottom: 8px; right: 16px; text-align: right;
        }
        .credit {
            font-size: 8px; color: var(--accent); text-transform: uppercase;
            letter-spacing: 1.5px; border-top: 1px solid rgba(0, 255, 255, 0.4);
            padding-top: 4px; display: inline-block; font-family: 'Press Start 2P', cursive;
        }

        /* --- MOBILE & IPAD TOUCH CONTROLS --- */
        #touchControls {
            position: absolute; bottom: 10px; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: flex-end;
            padding: 0 14px; z-index: 16; pointer-events: none;
        }
        .touch-group { display: flex; gap: 8px; pointer-events: auto; align-items: center; }
        .t-btn {
            width: clamp(44px, 7.5vw, 58px);
            height: clamp(44px, 7.5vw, 58px);
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.16);
            border: 2px solid rgba(0, 255, 255, 0.6);
            color: #fff; font-family: inherit;
            font-size: clamp(8px, 1.3vw, 10px); font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            user-select: none; cursor: pointer; backdrop-filter: blur(2px);
        }
        .t-btn:active { background: rgba(0, 255, 255, 0.55); color: #000; transform: scale(0.92); }
        .t-btn.fire { border-color: var(--danger); background: rgba(255, 0, 85, 0.22); }
        .t-btn.dash { border-color: var(--goal); background: rgba(255, 255, 0, 0.22); }
        .t-btn.slow { border-color: var(--purple); background: rgba(184, 41, 255, 0.22); }

        #time-display.low { color: var(--danger); animation: blink 0.5s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        #toast {
            position: absolute; bottom: 72px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 20, 10, 0.95); border: 2px solid var(--green);
            padding: 8px 16px; color: #fff; font-size: 11px; z-index: 30;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.5); pointer-events: none;
            border-radius: 4px;
        }
    </style>
</head>
<body class="lang-ar">

<div id="game-container">
    <canvas id="gameCanvas" width="900" height="500"></canvas>
    <div class="scanline"></div>

    <!-- Quick Top Bar -->
    <div id="quickControls">
        <button class="mini-btn lang" onclick="this.blur(); game.toggleLanguage();" id="langBtn">🌐 EN / عربي</button>
        <button class="mini-btn" onclick="this.blur(); game.toggleMusic();" id="musicBtn">BGM: ON</button>
        <button class="mini-btn" onclick="this.blur(); game.toggleTouch();" id="touchBtn">TOUCH</button>
        <button class="mini-btn" onclick="this.blur(); game.togglePause();" id="pauseBtn">PAUSE [P]</button>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-panel">
            <div class="stat-box" id="levelDisplay">STAGE: 01 / 70</div>
            <div class="stat-box"><span id="livesLabel">LIVES:</span> <span id="lifeContainer"></span></div>
            <div class="stat-box">
                <span id="energyLabel">ENERGY:</span>
                <div class="bar-wrap"><div id="energyBar" class="bar-fill" style="width:100%; background:#00ffff;"></div></div>
            </div>
            <!-- 3-Star Progress Tracker in HUD -->
            <div class="stat-box" id="missionHudBox" style="color:#ffcc00; font-size:10px;">
                <span id="orbsHud">🟡 0/0</span> &nbsp;|&nbsp; <span id="enemiesHud">👾 0/0</span> &nbsp;|&nbsp; <span id="noDeathHud">❤️ ★</span>
            </div>
        </div>

        <div class="hud-panel" style="text-align:right">
            <div class="stat-box" style="justify-content:flex-end; color:#ff0" id="scoreDisplay">SCORE: 00000</div>
            <div class="stat-box" style="justify-content:flex-end; color:#00ff66">
                <span id="creditDisplay">💎 0</span>
                <div class="diamond-prog-wrap" title="1000 Score = 5 Diamonds"><div id="diamondBar"></div></div>
            </div>
            <div class="stat-box" style="justify-content:flex-end; color:#ffcc00" id="starHudDisplay">★ 0 (3★ = 1💎)</div>
            <div class="stat-box" style="justify-content:flex-end;" id="time-display">TIME: 60</div>
        </div>
    </div>

    <!-- Boss Health Bar -->
    <div id="bossHud" class="hidden">
        <div id="bossName">⚠️ OMEGA CYBER-CORE ⚠️</div>
        <div id="bossBarOuter"><div id="bossBarInner"></div></div>
    </div>

    <!-- Style Rank & Combo -->
    <div id="styleBox" class="hidden">
        <div id="styleRank">S</div>
        <div id="comboText">COMBO x1</div>
    </div>

    <!-- Achievement Toast -->
    <div id="toast" class="hidden">🏆 ACHIEVEMENT UNLOCKED!</div>

    <!-- Touch Controls (Phone & iPad) -->
    <div id="touchControls" class="hidden">
        <div class="touch-group">
            <div class="t-btn" id="btnLeft">◀</div>
            <div class="t-btn" id="btnRight">▶</div>
            <div class="t-btn" id="btnDown">▼</div>
        </div>
        <div class="touch-group">
            <div class="t-btn slow" id="btnSlow">SLOW</div>
            <div class="t-btn fire" id="btnFire">FIRE</div>
            <div class="t-btn dash" id="btnDash">DASH</div>
            <div class="t-btn" id="btnJump">JUMP</div>
        </div>
    </div>

    <!-- START SCREEN -->
    <div id="startScreen" class="overlay">
        <div class="terminal-text" id="terminalIntro"></div>

        <h1>NEON NEXUS</h1>
        <div class="subtitle" id="subTitleText"></div>

        <p id="controlsHint"></p>

        <div class="menu-row">
            <button class="btn" id="btnStartCampaign" onclick="game.openLevelSelect()"></button>
            <button class="btn alt" id="btnStartEndless" onclick="game.startEndless()"></button>
        </div>
        <div class="menu-row" style="margin-top: 6px;">
            <button class="btn gold" id="btnOpenShop" onclick="game.openShop()"></button>
            <button class="btn" style="background:#00ff88" id="btnOpenAch" onclick="game.openAchievements()"></button>
            <button class="btn" style="background:#ffaa00" onclick="game.toggleLanguage()" id="menuLangBtn">🌐 English / العربية</button>
        </div>

        <div class="credit-container">
            <div class="credit">Designed by Abdal Rahman Hussein</div>
        </div>
    </div>

    <!-- LEVEL SELECT OVERLAY (7 PLATFORMS x 10 STAGES = 70 STAGES) -->
    <div id="levelSelectScreen" class="overlay hidden">
        <h1 style="font-size:20px; margin-bottom:2px;" id="lvlSelectTitle"></h1>
        <p style="margin-bottom:4px; color:#00ff66; font-weight:bold;" id="lvlSelectStats"></p>

        <!-- 7 Platform Tabs -->
        <div id="worldTabs"></div>

        <!-- Selected Platform Info Banner -->
        <div id="worldInfoBanner">
            <span id="worldNameText" style="color:#00ffff; font-weight:bold;"></span>
            <span id="worldDiffText" style="color:#ffcc00; font-weight:bold;"></span>
        </div>

        <!-- 10 Stages of Selected Platform -->
        <div id="levelGrid"></div>

        <p style="margin:2px 0 6px 0; color:#ffcc00; font-size:9px;" id="lvlSelectRules"></p>
        <button class="btn danger" id="btnBackLvl" onclick="game.closeSubMenus()"></button>
    </div>

    <!-- SHOP / ARMORY OVERLAY -->
    <div id="shopScreen" class="overlay hidden">
        <h1 style="font-size:20px; margin-bottom:2px;" id="shopTitle"></h1>
        <p style="margin-bottom:6px; color:#0f6; font-weight:bold;" id="shopSub"></p>
        <div class="grid-container" id="shopGrid"></div>
        <button class="btn danger" id="btnBackShop" onclick="game.closeSubMenus()"></button>
    </div>

    <!-- ACHIEVEMENTS OVERLAY -->
    <div id="achScreen" class="overlay hidden">
        <h1 style="font-size:20px; margin-bottom:6px;" id="achTitle"></h1>
        <div class="grid-container" id="achGrid"></div>
        <button class="btn danger" id="btnBackAch" onclick="game.closeSubMenus()"></button>
    </div>

    <!-- STAGE CLEAR OVERLAY (PERKS COST 3 DIAMONDS EACH) -->
    <div id="stageScreen" class="overlay hidden">
        <h1 style="color: var(--goal); font-size:20px; margin-bottom:2px;" id="stageClearTitle"></h1>
        <div id="stageStarsBig" style="font-size:24px; margin-bottom:4px; letter-spacing:6px;"></div>

        <div class="star-summary-box">
            <div class="star-row" id="starRow1"></div>
            <div class="star-row" id="starRow2"></div>
            <div class="star-row" id="starRow3"></div>
        </div>

        <p id="stageBonusText" style="color:#0ff; margin-bottom:4px; font-size:10px;"></p>
        <p style="color:#ffcc00; margin-bottom:6px; font-size:10px; font-weight:bold;" id="choosePerkText"></p>

        <!-- Paid Gifts (3 Diamonds Each) -->
        <div class="menu-row">
            <button class="btn" id="perkShieldBtn" onclick="game.buyStagePerk('shield')"></button>
            <button class="btn gold" id="perkOverdriveBtn" onclick="game.buyStagePerk('overdrive')"></button>
            <button class="btn alt" id="perkLifeBtn" onclick="game.buyStagePerk('life')"></button>
        </div>

        <!-- Free Next Stage / Replay / Map -->
        <div class="menu-row" style="margin-top:8px;">
            <button class="btn green" id="btnNextFree" onclick="game.nextStageFree()"></button>
            <button class="btn danger" id="btnReplayStage" onclick="game.replayCurrentStage()"></button>
            <button class="btn" style="background:#aaa" id="btnStageToMap" onclick="game.openLevelSelect()"></button>
        </div>
    </div>

    <!-- PAUSE OVERLAY -->
    <div id="pauseScreen" class="overlay hidden">
        <h1 id="pauseTitle">SYSTEM PAUSED</h1>
        <div class="menu-row">

            if (raw) {
                const parsed = JSON.parse(raw);
                this.data = {
                    ...this.data,
                    ...parsed,
                    upgrades: { ...this.data.upgrades, ...(parsed.upgrades || {}) },
                    stageStars: { ...(parsed.stageStars || {}) }
                };
            }
        } catch (e) {}
    }
    save() {
        try { localStorage.setItem('neon_nexus_v9_save', JSON.stringify(this.data)); } catch (e) {}
    }

        let total = 0;
        if (!this.data || !this.data.stageStars) return 0;
        Object.values(this.data.stageStars).forEach(arr => {
            if (Array.isArray(arr)) {
                total += (arr[0] ? 1 : 0) + (arr[1] ? 1 : 0) + (arr[2] ? 1 : 0);
            }
        });
        return total;
    }
    getClearedCount() {
        if (!this.data || !this.data.stageStars) return 0;
        return Object.keys(this.data.stageStars).length;
    }
}

class SoundManager {
    constructor() {
        this.ctx = null;
        this.bgmEnabled = true;
        this.bgmInterval = null;
        this.step = 0;
    }
    init() {
        try {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        } catch (e) {}
    }
    playTone(freq, type, duration, vol = 0.09, slideTo = null) {
        if (!this.ctx) return;
        try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
            gain.gain.setValueAtTime(vol, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + duration);
        } catch (e) {}
    }
    playJump(double = false) { this.playTone(double ? 260 : 160, 'square', 0.14, 0.08, double ? 620 : 380); }
    playDash() { this.playTone(500, 'sawtooth', 0.16, 0.1, 110); }
    playShoot() { this.playTone(900, 'square', 0.09, 0.07, 220); }
    playCollect() {
        this.playTone(1100, 'sine', 0.08, 0.08);
        setTimeout(() => this.playTone(1650, 'triangle', 0.12, 0.08), 45);
    }
    playDiamond() {
        [587.33, 880, 1174.66, 1760].forEach((f, i) => setTimeout(() => this.playTone(f, 'triangle', 0.22, 0.14), i * 65));
    }
    playKill() {
        this.playTone(220, 'sawtooth', 0.15, 0.12, 60);
        setTimeout(() => this.playTone(660, 'square', 0.1, 0.08, 990), 40);
    }
    playBounce() { this.playTone(180, 'sine', 0.25, 0.12, 750); }
    playShieldHit() { this.playTone(400, 'triangle', 0.25, 0.15, 120); }
    playWin() { [440, 554, 659, 880].forEach((f, i) => setTimeout(() => this.playTone(f, 'square', 0.18, 0.12), i * 80)); }
    playDeath() { this.playTone(140, 'sawtooth', 0.5, 0.22, 35); }
    startBGM(isBoss = false) {
        this.stopBGM();
        if (!this.bgmEnabled) return;
        const bassNotes = isBoss
            ? [110, 110, 130.8, 110, 146.8, 110, 123.5, 98]
            : [110, 110, 146.8, 146.8, 164.8, 164.8, 130.8, 146.8];
        const arpNotes = [440, 523.25, 659.25, 880, 659.25, 523.25];
        const tempo = isBoss ? 135 : 165;
        this.bgmInterval = setInterval(() => {
            if (!this.bgmEnabled || !this.ctx || !window.game || window.game.isPaused) return;
            const b = bassNotes[this.step % bassNotes.length];
            this.playTone(b, 'sawtooth', 0.14, 0.035);
            if (this.step % 2 === 0) {
                const a = arpNotes[(this.step / 2) % arpNotes.length];
                this.playTone(a, 'triangle', 0.1, 0.025);
            }
            this.step++;
        }, tempo);
    }
    stopBGM() {
        if (this.bgmInterval) { clearInterval(this.bgmInterval); this.bgmInterval = null; }
    }
}

class CityBackground {
    constructor() {
        this.mountains = [];
        this.cityBack = [];
        this.cityFront = [];
        this.rain = [];
        this.init();
    }
    init() {
        for (let i = 0; i < 18; i++) this.mountains.push({ x: i * 110, w: 150 + Math.random() * 100, h: 120 + Math.random() * 140, speed: 0.2 });
        for (let i = 0; i < 14; i++) this.cityBack.push({ x: i * 130, w: 80 + Math.random() * 60, h: 160 + Math.random() * 110, speed: 0.5 });
        for (let i = 0; i < 10; i++) {
            let h = 200 + Math.random() * 150;
            this.cityFront.push({ x: i * 190, w: 110 + Math.random() * 70, h: h, speed: 1.0, windows: this.generateWindows(110, h) });
        }
        for (let i = 0; i < 45; i++) this.rain.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, l: 10 + Math.random() * 12, s: 7 + Math.random() * 5 });
    }
    generateWindows(bw, bh) {
        let w = [];
        for (let wx = 10; wx < bw - 12; wx += 16) {
            for (let wy = 12; wy < bh - 15; wy += 22) {
                if (Math.random() > 0.35) w.push({ x: wx, y: wy, on: Math.random() > 0.75, c: Math.random() > 0.5 ? '#ff0' : '#0ff' });
            }
        }
        return w;
    }
    update(playerSpeed, dtScale) {
        let speed = Math.max(0.5, Math.abs(playerSpeed * 0.12)) * dtScale;
        [this.mountains, this.cityBack, this.cityFront].forEach(layer => {
            layer.forEach(b => {
                b.x -= b.speed * speed;
                if (b.x + b.w < 0) b.x = canvas.width + Math.random() * 60;
            });
        });
        this.rain.forEach(r => {
            r.y += r.s * dtScale;
            r.x -= 1.5 * dtScale;
            if (r.y > canvas.height) { r.y = -15; r.x = Math.random() * canvas.width; }
        });
    }
    draw(biome) {
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, biome.top);
        grad.addColorStop(1, biome.bot);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.shadowBlur = 35; ctx.shadowColor = biome.sun;
        let sunGrad = ctx.createLinearGradient(0, 60, 0, 210);
        sunGrad.addColorStop(0, biome.sun); sunGrad.addColorStop(1, '#ff0055');
        ctx.fillStyle = sunGrad;
        ctx.beginPath(); ctx.arc(canvas.width - 170, 145, 65, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = biome.top;
        for (let y = 155; y < 215; y += 10) ctx.fillRect(canvas.width - 240, y, 140, (y - 145) * 0.08);
        ctx.restore();

        this.mountains.forEach(b => { ctx.fillStyle = '#090718'; ctx.fillRect(b.x, canvas.height - b.h, b.w, b.h); });
        this.cityBack.forEach(b => { ctx.fillStyle = '#120f29'; ctx.fillRect(b.x, canvas.height - b.h, b.w, b.h); });
        this.cityFront.forEach(b => {
            ctx.fillStyle = '#1b1838';
            ctx.fillRect(b.x, canvas.height - b.h, b.w, b.h);
            b.windows.forEach(w => {
                ctx.fillStyle = w.on ? w.c : '#0d0b1d';
                ctx.fillRect(b.x + w.x, canvas.height - b.h + w.y, 7, 11);
            });
        });

        ctx.strokeStyle = 'rgba(0, 255, 255, 0.22)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        this.rain.forEach(r => { ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - 3, r.y + r.l); });
        ctx.stroke();
    }
}

class FloatingText {
    constructor(x, y, text, color = '#ff0') {
        this.x = x; this.y = y; this.text = text; this.color = color;
        this.life = 1.0; this.vy = -1.6;
    }
    update(dtScale) { this.y += this.vy * dtScale; this.life -= 0.02 * dtScale; }
    draw() {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.font = 'bold 12px "Cairo", "Press Start 2P", sans-serif';
        ctx.fillText(this.text, this.x, this.y);
        ctx.globalAlpha = 1.0;
    }
}

class Particle {
    constructor(x, y, color, type = 'spark') {
        this.x = x; this.y = y; this.color = color;
        this.size = Math.random() * 5 + 2;
        this.speedX = (Math.random() - 0.5) * 9;
        this.speedY = (Math.random() - 0.5) * 9;
        this.life = 1.0;
        this.type = type;
        if (type === 'thruster') { this.speedY = Math.random() * 2 + 2; this.speedX *= 0.4; }
        if (type === 'ring') { this.radius = 5; }
    }
    update(dtScale) {
        if (this.type === 'ring') { this.radius += 2.6 * dtScale; this.life -= 0.05 * dtScale; return; }
        this.x += this.speedX * dtScale; this.y += this.speedY * dtScale;
        this.life -= 0.03 * dtScale;
        if (this.type === 'thruster') this.size *= 0.9;
    }
    draw() {
        ctx.globalAlpha = Math.max(0, this.life);
        if (this.type === 'ring') {
            ctx.strokeStyle = this.color; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.stroke();
        } else {
            ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.size, this.size);
        }
        ctx.globalAlpha = 1.0;
    }
}

class Projectile {
    constructor(x, y, vx, vy, isEnemy = false, color = '#00ffff', size = 8) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.isEnemy = isEnemy; this.color = color; this.size = size;
        this.dead = false;
    }
    update(dtScale) { this.x += this.vx * dtScale; this.y += this.vy * dtScale; }
    draw() {
        ctx.save();
        ctx.shadowBlur = 10; ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x - this.size / 2, this.y - 3, this.size * 1.6, 6);
        ctx.fillStyle = '#fff';
        ctx.fillRect(this.x - 2, this.y - 1, 4, 2);
        ctx.restore();
    }
}

class BossCore {
    constructor(x, y, level) {
        this.x = x; this.y = y;
        this.w = 68; this.h = 68;
        const worldIdx = Math.ceil(level / 10);
        this.maxHp = 10 + worldIdx * 5 + Math.floor(level * 0.6);
        this.hp = this.maxHp;
        this.angle = 0;
        this.shootTimer = 0;
        this.fireInterval = Math.max(26, 76 - worldIdx * 6);
        this.bulletSpeed = 5.2 + (worldIdx * 0.45);
        this.dead = false;
    }
    update(player, game, dtScale) {
        if (this.dead) return;
        this.angle += 0.05 * dtScale;
        let targetX = player.x + 240 + Math.cos(this.angle * 0.5) * 60;
        this.x += (targetX - this.x) * 0.06 * dtScale;
        this.y = 185 + Math.sin(this.angle * 0.85) * 75;

        this.shootTimer += dtScale;
        if (this.shootTimer > this.fireInterval) {
            this.shootTimer = 0;
            let dx = (player.x + 15) - (this.x + 34);
            let dy = (player.y + 15) - (this.y + 34);
            let mag = Math.hypot(dx, dy) || 1;
            game.projectiles.push(new Projectile(this.x, this.y + 34, (dx / mag) * this.bulletSpeed, (dy / mag) * this.bulletSpeed, true, '#ff0055', 10));
            soundManager.playShoot();
        }
    }
    draw() {
        if (this.dead) return;
        ctx.save();
        ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
        ctx.shadowBlur = 22; ctx.shadowColor = '#ff0055';
        ctx.rotate(this.angle);
        ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 5;
        ctx.strokeRect(-34, -34, 68, 68);
        ctx.rotate(-this.angle * 2);
        ctx.fillStyle = '#220011';
        ctx.fillRect(-24, -24, 48, 48);
        ctx.fillStyle = '#ffff00';
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ff0000';
        ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
}

class Player {
    constructor(game) {
        this.game = game;
        this.w = 30; this.h = 30;
        this.reset();
    }
    reset() {
        this.x = this.game.checkpointX || 100;
        this.y = this.game.checkpointY || 200;
        this.vx = 0; this.vy = 0;
        this.isGrounded = false;
        this.coyoteTimer = 0;
        this.jumpsLeft = 2;
        this.jumpKeyReleased = true;
        this.dead = false;
        this.squash = 1; this.stretch = 1;
        this.facingRight = true;

        this.energy = 100;
        this.dashTimer = 0;
        this.dashCooldown = 0;
        this.shootCooldown = 0;
        this.invulnTimer = 0;
        this.hasShield = false;
        this.magnetTimer = 0;
        this.overdriveTimer = 0;
        this.ghostTrail = [];
    }

    update(input, platforms, dtScale) {
        if (this.dead) return;

        const speedMult = 1 + (saveSys.data.upgrades.thruster * 0.025);
        const jumpMult = 1 + (saveSys.data.upgrades.thruster * 0.012);
        const energyRegen = 0.28 + (saveSys.data.upgrades.chrono * 0.045);
        const maxSpeed = 8.2 * speedMult;

        this.energy = Math.min(100, this.energy + energyRegen * dtScale);
        if (this.dashCooldown > 0) this.dashCooldown -= dtScale;
        if (this.shootCooldown > 0) this.shootCooldown -= dtScale;
        if (this.invulnTimer > 0) this.invulnTimer -= dtScale;
        if (this.magnetTimer > 0) this.magnetTimer -= dtScale;
        if (this.overdriveTimer > 0) this.overdriveTimer -= dtScale;

        if (this.dashTimer > 0) {
            this.dashTimer -= dtScale;
            this.vx = (this.facingRight ? 18 : -18);
            this.vy = 0;
            if (Math.random() > 0.2) this.ghostTrail.push({ x: this.x, y: this.y, alpha: 0.7 });
        } else {
            if (input.keys['ArrowRight'] || input.keys['KeyD']) { this.vx += 0.95 * speedMult * dtScale; this.facingRight = true; }
            else if (input.keys['ArrowLeft'] || input.keys['KeyA']) { this.vx -= 0.95 * speedMult * dtScale; this.facingRight = false; }
            this.vx *= Math.pow(0.86, dtScale);
            this.vx = Math.max(Math.min(this.vx, maxSpeed), -maxSpeed);
        }

        const dashCost = Math.max(15, 25 - saveSys.data.upgrades.chrono);
        if ((input.keys['ShiftLeft'] || input.keys['ShiftRight'] || input.keys['KeyX']) && this.dashCooldown <= 0 && this.energy >= dashCost) {
            this.dashTimer = 9;
            this.dashCooldown = Math.max(14, 24 - saveSys.data.upgrades.chrono);
            this.invulnTimer = 14;
            this.energy -= dashCost;
            this.game.screenShake = 6;
            soundManager.playDash();
            this.game.createParticles(this.x + 15, this.y + 15, '#00ffff', 12);
        }

        if ((input.keys['ArrowDown'] || input.keys['KeyS']) && !this.isGrounded && this.vy < 16) {
            this.vy = 19;
            this.game.createParticles(this.x + 15, this.y, '#ff00ff', 3);
        }

        if ((input.keys['KeyF'] || input.keys['KeyC']) && this.shootCooldown <= 0) {
            const bLevel = saveSys.data.upgrades.blaster;
            const isOD = this.overdriveTimer > 0;
            this.shootCooldown = isOD ? 6 : Math.max(7, 22 - Math.floor(bLevel * 1.4));
            let dir = this.facingRight ? 1 : -1;
            let pSize = 7 + Math.floor(bLevel * 0.8);
            this.game.projectiles.push(new Projectile(this.x + 15 + dir * 16, this.y + 14, dir * 15, 0, false, isOD ? '#ffff00' : '#00ffff', pSize));
            if (isOD || bLevel >= 5) {
                this.game.projectiles.push(new Projectile(this.x + 15 + dir * 16, this.y + 6, dir * 15, -1.2, false, '#ff00ff', pSize));
            }
            if (bLevel >= 10) {
                this.game.projectiles.push(new Projectile(this.x + 15 + dir * 16, this.y + 22, dir * 15, 1.2, false, '#00ff66', pSize));
            }
            soundManager.playShoot();
        }

        const jumpPressed = input.keys['Space'] || input.keys['ArrowUp'] || input.keys['KeyW'];
        if (jumpPressed && this.jumpKeyReleased) {
            if (this.isGrounded || this.coyoteTimer > 0) {
                this.vy = -14.2 * jumpMult;
                this.isGrounded = false;
                this.coyoteTimer = 0;
                this.jumpsLeft = 1;
                soundManager.playJump(false);
                this.stretch = 1.35; this.squash = 0.75;
                this.game.createParticles(this.x + 15, this.y + 30, '#fff', 8);
            } else if (this.jumpsLeft > 0) {
                this.vy = -12.8 * jumpMult;
                this.jumpsLeft--;
                soundManager.playJump(true);
                this.stretch = 1.3; this.squash = 0.8;
                this.game.particles.push(new Particle(this.x + 15, this.y + 30, '#00ffff', 'ring'));
            }
            this.jumpKeyReleased = false;
        }
        if (!jumpPressed) this.jumpKeyReleased = true;

        if (this.dashTimer <= 0) {
            this.vy += 0.78 * dtScale;
            if (!jumpPressed && this.vy < -4) this.vy += 0.45 * dtScale;
        }

        this.x += this.vx * dtScale;
        this.y += this.vy * dtScale;

        if (this.isGrounded) { this.coyoteTimer = 7; this.jumpsLeft = 2; }
        else this.coyoteTimer -= dtScale;

        if (this.x < 0) this.x = 0;
        if (this.y > canvas.height + 100) this.game.loseLife(true);

        this.isGrounded = false;
        const magnetRange = 45 + (saveSys.data.upgrades.magnet * 22) + (this.magnetTimer > 0 ? 150 : 0);

        platforms.forEach(p => {
            if (p.isMoving) {
                const moveDelta = p.dx * dtScale;
                p.x += moveDelta;
                if (p.orb && !p.orb.collected) p.orb.x += moveDelta;
                if (p.x < p.originX) { p.x = p.originX; p.dx = Math.abs(p.dx); }
                if (p.x > p.originX + p.range) { p.x = p.originX + p.range; p.dx = -Math.abs(p.dx); }
            }
            if (p.type === 'crumble' && p.crumbleState === 1) {
                p.timer -= dtScale;
                if (p.timer <= 0) { p.crumbleState = 2; p.respawn = 130; }
            } else if (p.type === 'crumble' && p.crumbleState === 2) {
                p.respawn -= dtScale;
                if (p.respawn <= 0) p.crumbleState = 0;
                return;
            }

            if (this.x + this.w > p.x && this.x < p.x + p.w) {
                if (this.y + this.h >= p.y && this.y + this.h <= p.y + 32 && this.vy >= 0) {
                    if ((this.y + this.h - this.vy * dtScale) <= p.y + 12) {
                        if (p.type === 'bounce') {
                            this.vy = -20.5;
                            this.jumpsLeft = 2;
                            soundManager.playBounce();
                            this.game.particles.push(new Particle(this.x + 15, p.y, '#00ff66', 'ring'));
                            return;
                        }
                        if (p.type === 'crumble' && p.crumbleState === 0) {
                            p.crumbleState = 1;
                            p.timer = p.crumbleDuration || 26;
                        }
                        if (this.vy > 16) {
                            this.game.screenShake = 10;
                            this.game.particles.push(new Particle(this.x + 15, p.y, '#ff00ff', 'ring'));
                        }
                        this.isGrounded = true; this.vy = 0; this.y = p.y - this.h;
                        if (p.isMoving) this.x += p.dx * dtScale;
                        if (this.stretch > 1.1) { this.squash = 1.25; this.stretch = 0.8; }
                    }
                }
            }

            if (p.checkpoint && !p.checkpointClaimed && this.x + this.w > p.x + p.w / 2) {
                p.checkpointClaimed = true;
                this.game.checkpointX = p.x + p.w / 2 - 15;
                this.game.checkpointY = p.y - 50;
                this.game.floatingTexts.push(new FloatingText(p.x + p.w / 2, p.y - 45, this.game.t('checkpoint'), "#00ff66"));
                soundManager.playCollect();
            }

            if (p.type === 'spike') {
                const sx = p.x + p.w / 2, sy = p.y;
                if (this.x + this.w > sx - 14 && this.x < sx + 14 && this.y + this.h > sy - 28 && this.y < sy + 8) {
                    this.game.hitPlayer();
                }
            }
            if (p.type === 'laser') {
                p.laserTimer = (p.laserTimer || 0) + dtScale * (p.laserSpeed || 1);
                const active = Math.sin(p.laserTimer * 0.06) > -0.25;
                p.laserActive = active;
                if (active && this.invulnTimer <= 0) {
                    const lx = p.x + p.w / 2;
                    if (this.x + this.w > lx - 6 && this.x < lx + 6 && this.y + this.h > p.y - 90 && this.y < p.y) {
                        this.game.hitPlayer();
                    }
                }
            }

            if (p.drone && !p.drone.dead) {
                let d = p.drone;
                d.x += d.vx * dtScale;
                if (d.x < p.x + 8) { d.x = p.x + 8; d.vx = Math.abs(d.vx); }
                if (d.x > p.x + p.w - 34) { d.x = p.x + p.w - 34; d.vx = -Math.abs(d.vx); }

                if (this.x + this.w > d.x && this.x < d.x + 26 && this.y + this.h > d.y && this.y < d.y + 26) {
                    if ((this.vy > 0 && this.y + this.h - this.vy * dtScale <= d.y + 16) || this.dashTimer > 0) {
                        d.dead = true;
                        this.vy = -12;
                        this.jumpsLeft = 2;
                        this.game.registerKill(d.x, d.y);
                    } else {
                        this.game.hitPlayer();
                    }
                }
            }

            if (p.orb && !p.orb.collected) {
                const ox = p.orb.x + 8, oy = p.orb.y + 8;
                const dx = (this.x + 15) - ox, dy = (this.y + 15) - oy;
                const dist = Math.hypot(dx, dy);
                if (dist < magnetRange) {
                    p.orb.x += (dx / dist) * 7.5 * dtScale;
                    p.orb.y += (dy / dist) * 7.5 * dtScale;
                }
                if (dist < 28) {
                    p.orb.collected = true;
                    this.game.collectOrb(p.orb);
                }
            }

            if (p.type === 'goal' && !this.game.isEndless && this.x > p.x + p.w / 2 - 20) {
                this.game.levelComplete();
            }
        });

        this.ghostTrail = this.ghostTrail.filter(g => {
            g.alpha -= 0.06 * dtScale;
            return g.alpha > 0;
        });

        this.stretch += (1 - this.stretch) * 0.14 * dtScale;
        this.squash += (1 - this.squash) * 0.14 * dtScale;
        if (!this.isGrounded && Math.random() > 0.3) {
            const skin = SKINS.find(s => s.id === saveSys.data.equippedSkin) || SKINS[0];
            this.game.createParticles(this.x + 15, this.y + 30, skin.trail, 1, 'thruster');
        }
    }

    draw() {
        if (this.dead) return;
        const skin = SKINS.find(s => s.id === saveSys.data.equippedSkin) || SKINS[0];

        this.ghostTrail.forEach(g => {
            ctx.globalAlpha = Math.max(0, g.alpha * 0.5);
            ctx.fillStyle = skin.trail;
            ctx.fillRect(g.x, g.y, this.w, this.h);
        });
        ctx.globalAlpha = 1.0;

        ctx.save();
        ctx.translate(this.x + this.w / 2, this.y + this.h);
        ctx.scale(this.squash, this.stretch);
        ctx.rotate(this.vx * 0.035);

        if (this.invulnTimer > 0 && Math.floor(this.invulnTimer) % 2 === 0) ctx.globalAlpha = 0.5;

        ctx.fillStyle = skin.color;
        ctx.shadowBlur = 14; ctx.shadowColor = skin.color;
        ctx.fillRect(-this.w / 2, -this.h, this.w, this.h);

        ctx.shadowBlur = 0; ctx.fillStyle = '#000';
        let eyeOff = this.facingRight ? 5 : -3;
        ctx.fillRect(-this.w / 4 + eyeOff, -this.h + 7, this.w / 2 + 4, 7);
        ctx.fillStyle = skin.visor;
        ctx.fillRect(-this.w / 4 + eyeOff + (this.facingRight ? 4 : -2), -this.h + 9, 6, 3);

        if (this.hasShield) {
            ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.arc(0, -this.h / 2, 24, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.restore();
    }
}

// ==========================================
// 8. 7-PLATFORM (70 STAGES) LEVEL GENERATOR WITH DISTINCT SHAPES & DIFFICULTIES
// ==========================================
class LevelGenerator {
    getWorldIndex(levelNum) {
        return Math.min(7, Math.max(1, Math.ceil(levelNum / 10)));
    }

    generateChunk(platforms, startX, startY, chunkLen, levelNum, isEndless = false) {
        const worldIdx = isEndless ? 4 : this.getWorldIndex(levelNum);
        const stageInWorld = ((levelNum - 1) % 10) + 1;

        const worldBaseDiff = (worldIdx - 1) / 6;
        const subStageDiff = (stageInWorld - 1) / 90;
        const difficulty = isEndless ? 0.65 : Math.min(1.0, worldBaseDiff * 0.88 + subStageDiff);

        let maxGap = 75 + (difficulty * 125);
        let minW = Math.max(62, 165 - (difficulty * 88));
        let maxW = Math.max(115, 275 - (difficulty * 95));
        let movingChance = Math.min(0.68, 0.04 + difficulty * 0.58);
        let moveSpeed = 1.2 + (difficulty * 2.8);
        let droneSpeed = 1.5 + (difficulty * 3.0);
        let crumbleDur = Math.max(12, 36 - Math.floor(difficulty * 22));
        let laserSpd = 0.65 + difficulty * 1.55;

        let currX = startX, currY = startY;
        let steps = 0;

        while (currX < startX + chunkLen) {
            steps++;
            let w = Math.floor(Math.random() * (maxW - minW) + minW);
            let isCheckpointPlat = (!isEndless && steps === Math.floor(7 + worldIdx * 1.5));
            if (steps % 9 === 0 || isCheckpointPlat) w = 320;

            let gap = Math.floor(Math.random() * 42 + maxGap);
            let y = currY + (Math.random() * 100 - 50);
            if (y < 170) y = 170;
            if (y > 405) y = 405;

            let type = 'normal';
            let r = Math.random();
            if (!isCheckpointPlat && steps % 9 !== 0) {
                let hazardThreshold = 0.08 + difficulty * 0.32;
                if (r < hazardThreshold) type = 'spike';
                else if (r < hazardThreshold + 0.11) type = 'bounce';
                else if (r < hazardThreshold + 0.25 && (worldIdx >= 2 || stageInWorld >= 4 || isEndless)) type = 'crumble';
                else if (r < hazardThreshold + 0.38 && (worldIdx >= 2 || stageInWorld >= 7 || isEndless)) type = 'laser';
            }

            let isMoving = (type === 'normal' && !isCheckpointPlat && Math.random() < movingChance);

            let orb = null;
            if ((type === 'normal' || type === 'bounce' || type === 'crumble') && Math.random() > 0.32) {
                let oRoll = Math.random();
                let oType = 'score';
                if (oRoll > 0.93) oType = 'shield';
                else if (oRoll > 0.86) oType = 'magnet';
                orb = { x: currX + gap + w / 2 - 8, y: y - 54, collected: false, kind: oType };
            }

            let drone = null;
            if (type === 'normal' && !isMoving && w >= 135 && !isCheckpointPlat && Math.random() < (0.14 + difficulty * 0.50)) {
                drone = { x: currX + gap + 25, y: y - 26, vx: droneSpeed, dead: false };
            }

            platforms.push({
                x: currX + gap, y: y, w: w, type: type,
                worldIdx: worldIdx,
                orb: orb, drone: drone,
                checkpoint: isCheckpointPlat, checkpointClaimed: false,
                crumbleState: 0, timer: 0, respawn: 0, crumbleDuration: crumbleDur,
                laserSpeed: laserSpd,
                isMoving: isMoving, dx: isMoving ? (Math.random() > 0.5 ? moveSpeed : -moveSpeed) : 0,
                range: isMoving ? (80 + difficulty * 55) : 0, originX: currX + gap
            });

            currX += gap + w;
            currY = y;
        }
        return { endX: currX, endY: currY };
    }

    generate(levelNum, isEndless = false) {
        const worldIdx = isEndless ? 4 : this.getWorldIndex(levelNum);
        const platforms = [];
        platforms.push({ x: 0, y: 330, w: 460, type: 'normal', worldIdx: worldIdx });
        let stageLen = isEndless ? 6000 : (2200 + worldIdx * 420 + ((levelNum - 1) % 10) * 140);
        const res = this.generateChunk(platforms, 460, 330, stageLen, levelNum, isEndless);

        if (!isEndless) {
            platforms.push({ x: res.endX + 60, y: 320, w: 260, type: 'goal', worldIdx: worldIdx });
        }
        return platforms;
    }
}

    addScore(points) {
        if (points <= 0) return;
        const greedMult = 1 + (saveSys.data.upgrades.greed || 0) * 0.08;
        this.score += Math.round(points * greedMult);
        const currentMilestone = Math.floor(this.score / 1000);
        if (currentMilestone > this.lastDiamondMilestone) {
            const milestonesCrossed = currentMilestone - this.lastDiamondMilestone;
            const earnedDiamonds = milestonesCrossed * 5;
            this.lastDiamondMilestone = currentMilestone;
            saveSys.data.credits += earnedDiamonds;
            saveSys.save();
            soundManager.playDiamond();
            this.floatingTexts.push(new FloatingText(this.player.x, this.player.y - 35, this.t('diamondEarned5'), "#00ff66"));
        }
        if (this.isEndless && this.score >= 3000) this.unlockAchievement('endless_3000');
    }

    checkStarDiamonds() {
        const totalStars = saveSys.getTotalStars();
        const eligibleDiamonds = Math.floor(totalStars / 3);
        if (eligibleDiamonds > saveSys.data.starDiamondsClaimed) {
            const newlyEarned = eligibleDiamonds - saveSys.data.starDiamondsClaimed;
            saveSys.data.starDiamondsClaimed = eligibleDiamonds;
            saveSys.data.credits += newlyEarned;
            saveSys.save();
            soundManager.playDiamond();
            return newlyEarned;
        }
        return 0;
    }

    // --- 7 PLATFORMS (70 STAGES) LEVEL SELECT SCREEN ---
    openLevelSelect() {
        soundManager.init();

        this.inMenu = true;

        this.hideAllScreens();

    renderLevelSelect() {
        const isAr = saveSys.data.lang === 'ar';
        const cleared = saveSys.getClearedCount();
        const totalStars = saveSys.getTotalStars();

        document.getElementById('lvlSelectStats').innerText = isAr
            ? `المراحل المجتازة: ${cleared} / ${this.totalLevels}  |  مجموع النجوم: ★ ${totalStars} / 210  |  الألماس: 💎 ${saveSys.data.credits}`
            : `STAGES CLEARED: ${cleared} / ${this.totalLevels}  |  TOTAL STARS: ★ ${totalStars} / 210  |  DIAMONDS: 💎 ${saveSys.data.credits}`;

        const tabsContainer = document.getElementById('worldTabs');
        tabsContainer.innerHTML = '';
        PLATFORMS_WORLDS.forEach(w => {
            const firstStageOfWorld = (w.id - 1) * 10 + 1;
            const worldUnlocked = saveSys.data.maxStageUnlocked >= firstStageOfWorld;
            const tab = document.createElement('button');
            tab.className = `world-tab ${this.selectedWorldTab === w.id ? 'active' : ''}`;
            tab.style.borderColor = this.selectedWorldTab === w.id ? w.accent : '#446';
            tab.innerText = isAr ? `المنصة ${w.id} ${worldUnlocked ? '' : '🔒'}` : `PLAT ${w.id} ${worldUnlocked ? '' : '🔒'}`;
            tab.onclick = () => {
                this.selectedWorldTab = w.id;
                soundManager.playCollect();
                this.renderLevelSelect();
            };
            tabsContainer.appendChild(tab);
        });

        const currentWorld = PLATFORMS_WORLDS[this.selectedWorldTab - 1];
        document.getElementById('worldNameText').innerText = isAr ? currentWorld.nameAr : currentWorld.nameEn;
        document.getElementById('worldNameText').style.color = currentWorld.accent;
        document.getElementById('worldDiffText').innerText = isAr ? currentWorld.diffAr : currentWorld.diffEn;

        const grid = document.getElementById('levelGrid');
        grid.innerHTML = '';
        const startStage = (this.selectedWorldTab - 1) * 10 + 1;
        const endStage = startStage + 9;

        for (let i = startStage; i <= endStage; i++) {
            const isUnlocked = i <= saveSys.data.maxStageUnlocked;
            const starsArr = saveSys.data.stageStars[i] || [false, false, false];
            const isCleared = !!saveSys.data.stageStars[i];
            const isBoss = (i % 5 === 0);
            const stageNumInWorld = ((i - 1) % 10) + 1;

            const card = document.createElement('div');
            card.className = `lvl-card ${!isUnlocked ? 'locked' : ''} ${isCleared ? 'cleared' : ''} ${isBoss ? 'boss-stage' : ''}`;

            let starsHtml = '';
            for (let s = 0; s < 3; s++) {
                starsHtml += `<span class="${starsArr[s] ? 'star-on' : 'star-off'}">★</span>`;
            }

            card.innerHTML = `
                <div class="lvl-num">${isUnlocked ? (isBoss ? '💀 ' : '') + `${this.selectedWorldTab}-${stageNumInWorld}` : '🔒 ' + `${this.selectedWorldTab}-${stageNumInWorld}`}</div>
                <div style="font-size:9px; color:#aaa; margin-bottom:2px;">#${i.toString().padStart(2, '0')}</div>
                <div class="lvl-stars">${starsHtml}</div>
            `;

            if (isUnlocked) {
                card.onclick = () => {
                    this.startStageFromSelect(i);
                };
            }
            grid.appendChild(card);
        }
    }

    startStageFromSelect(stageNum) {
        soundManager.init();
        this.isEndless = false;
        this.inMenu = false;
        this.lives = 3;
        this.combo = 0;
        this.hideAllScreens();
        this.loadLevel(stageNum);
        this.isPaused = false;
        this.startLoop();
    }

    replayCurrentStage() {
        this.startStageFromSelect(this.levelNum);
    }

    buyStagePerk(perk) {
        if (saveSys.data.credits < 3) {
            soundManager.playDeath();
            this.showToast(this.t('noDiamonds'));
            return;
        }
        saveSys.data.credits -= 3;
        saveSys.save();
        soundManager.playDiamond();

        this.screens.stage.classList.add('hidden');
        this.levelNum++;
        this.loadLevel(this.levelNum);
        if (perk === 'shield') this.player.hasShield = true;
        if (perk === 'overdrive') this.player.overdriveTimer = 900;
        if (perk === 'life') { this.lives = Math.min(9, this.lives + 1); this.player.energy = 100; }
        this.updateHUD();
        this.isPaused = false;
        this.startLoop();
    }

    nextStageFree() {
        this.screens.stage.classList.add('hidden');
        this.levelNum++;
        this.loadLevel(this.levelNum);
        this.updateHUD();
        this.isPaused = false;
        this.startLoop();
    }

    setupTouchControls() {
        const bindTouch = (id, code) => {
            const el = document.getElementById(id);
            if (!el) return;
            const press = (e) => { e.preventDefault(); this.input.keys[code] = true; };
            const release = (e) => { e.preventDefault(); this.input.keys[code] = false; };
            el.addEventListener('touchstart', press, { passive: false });
            el.addEventListener('touchend', release, { passive: false });
            el.addEventListener('touchcancel', release, { passive: false });
            el.addEventListener('mousedown', press);
            el.addEventListener('mouseup', release);
            el.addEventListener('mouseleave', release);
        };
        bindTouch('btnLeft', 'ArrowLeft');
        bindTouch('btnRight', 'ArrowRight');
        bindTouch('btnDown', 'ArrowDown');
        bindTouch('btnJump', 'Space');
        bindTouch('btnDash', 'ShiftLeft');
        bindTouch('btnFire', 'KeyF');
        bindTouch('btnSlow', 'KeyQ');

        if ('ontouchstart' in window || navigator.maxTouchPoints > 0 || window.innerWidth <= 1024) {
            document.getElementById('touchControls').classList.remove('hidden');
        }
    }

    toggleTouch() {
        document.getElementById('touchControls').classList.toggle('hidden');
    }

    toggleMusic() {
        soundManager.init();
        soundManager.bgmEnabled = !soundManager.bgmEnabled;
        document.getElementById('musicBtn').innerText = `BGM: ${soundManager.bgmEnabled ? 'ON' : 'OFF'}`;
        if (soundManager.bgmEnabled && !this.isPaused) soundManager.startBGM(!!this.boss);
        else soundManager.stopBGM();

    togglePause() {
        if (this.inMenu) return;
        this.isPaused = !this.isPaused;
        this.screens.pause.classList.toggle('hidden', !this.isPaused);
        if (!this.isPaused) {
            this.startLoop();

        if (saveSys.data.achievements.includes(id)) return;
        const ach = ACHIEVEMENTS.find(a => a.id === id);

        saveSys.data.achievements.push(id);
        saveSys.data.credits += ach.reward;
        saveSys.save();
        this.updateHUD();
        const title = saveSys.data.lang === 'ar' ? ach.nameAr : ach.nameEn;
        this.showToast(`🏆 ${title} (+${ach.reward} 💎)`);

    renderShop() {
        const isAr = saveSys.data.lang === 'ar';
        document.getElementById('shopSub').innerText = `${this.t('shopSub')}${saveSys.data.credits}`;
        const grid = document.getElementById('shopGrid');

            const lvl = saveSys.data.upgrades[u.id] || 0;
            const cost = getUpgradeCost(u, lvl);
            const maxed = lvl >= u.max;

            card.className = `card ${maxed ? 'active' : ''}`;
            card.innerHTML = `
                <h3>⚡ ${isAr ? u.nameAr : u.nameEn} (LV.${lvl}/${u.max})</h3>

            card.className = `card ${equipped ? 'active' : ''}`;

                    soundManager.playWin();
